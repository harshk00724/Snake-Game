# Snake-Game
#Downlaod to play!
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root { --lcd:#9bbc0f; --dark:#0f380f; --mid:#306230; --body:#c9c4b4; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--body); font-family:'Courier New', monospace; color:var(--dark); }
  .console { background:#e4dfce; border:4px solid var(--dark); border-radius:16px 16px 48px 16px; padding:20px; width:min(92vw, 440px); }
  .hud { display:flex; justify-content:space-between; font-weight:bold; margin-bottom:8px; }
  .screen { position:relative; border:6px solid var(--mid); background:var(--lcd); }
  canvas { display:block; width:100%; height:auto; image-rendering: pixelated; }
  #msg { position:absolute; inset:0; display:grid; place-items:center; text-align:center; background:rgba(155,188,15,.88); font-weight:bold; padding:12px; white-space:pre-line; }
  p { margin:12px 0 0; font-size:.85rem; }
</style>
</head>
<body>
<div class="console">
  <div class="hud"><span>Score <span id="score">0</span></span><span>Best <span id="best">0</span></span></div>
  <div class="screen">
    <canvas id="c" width="400" height="400" aria-label="Snake game board"></canvas>
    <div id="msg">Press any arrow key or WASD
to start</div>
  </div>
  <p>Move: arrows or WASD. Pause: space. Restart: R.</p>
</div>

<script>
const N = 20, S = 20;                       // grid size and cell size in px
const ctx = document.getElementById('c').getContext('2d');
const msg = document.getElementById('msg');
let snake, dir, nextDir, food, score, timer, running, paused;
let best = +(localStorage.getItem('snake-best') || 0);
document.getElementById('best').textContent = best;

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = nextDir = { x: 1, y: 0 };
  score = 0; running = false; paused = false;
  document.getElementById('score').textContent = 0;
  placeFood(); draw(); clearInterval(timer);
  msg.hidden = false; msg.textContent = 'Press any arrow key or WASD\nto start';
}

function placeFood() {
  do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}

function start() {
  running = true; msg.hidden = true;
  timer = setInterval(step, 110);
}

function step() {
  if (paused) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++; document.getElementById('score').textContent = score; placeFood();
  } else snake.pop();
  draw();
}

function gameOver() {
  clearInterval(timer); running = false;
  if (score > best) { best = score; localStorage.setItem('snake-best', best); document.getElementById('best').textContent = best; }
  msg.hidden = false; msg.textContent = `Game over\nScore: ${score}\nPress R to restart`;
}

function draw() {
  ctx.fillStyle = '#9bbc0f'; ctx.fillRect(0, 0, N * S, N * S);
  ctx.fillStyle = '#0f380f';
  snake.forEach(s => ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2));
  ctx.fillStyle = '#306230';
  ctx.fillRect(food.x * S + 4, food.y * S + 4, S - 8, S - 8);
}

const keys = { ArrowUp:[0,-1], w:[0,-1], ArrowDown:[0,1], s:[0,1], ArrowLeft:[-1,0], a:[-1,0], ArrowRight:[1,0], d:[1,0] };
document.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'r') return reset();
  if (k === ' ') { if (running) { paused = !paused; msg.hidden = !paused; msg.textContent = 'Paused'; } e.preventDefault(); return; }
  if (!keys[k]) return;
  e.preventDefault();
  const [x, y] = keys[k];
  if (x === -dir.x && y === -dir.y) return;   // can't reverse into yourself
  nextDir = { x, y };
  if (!running && !msg.textContent.startsWith('Game over')) start();
});

// Touch: swipe to steer
let t0;
document.addEventListener('touchstart', e => t0 = e.touches[0]);
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - t0.clientX, dy = e.changedTouches[0].clientY - t0.clientY;
  const k = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp');
  document.dispatchEvent(new KeyboardEvent('keydown', { key: k }));
});

reset();
</script>
</body>
</html>
